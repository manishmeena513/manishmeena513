<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Manish Meena - Design and Engineering</title>
  <desc id="desc">A custom midnight blue banner with electric blue gradients, subtle grid lines and animated glowing accents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset=".55" stop-color="#102A43"/>
      <stop offset="1" stop-color="#123B68"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset=".5" stop-color="#38BDF8" stop-opacity=".9"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#93C5FD" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="300" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="22" fill="url(#grid)"/>
  <circle cx="1030" cy="40" r="170" fill="#38BDF8" opacity=".08"/>
  <circle cx="1060" cy="250" r="210" fill="#2563EB" opacity=".12"/>
  <path d="M0 238H1200" stroke="url(#line)" stroke-width="2"/>
  <path d="M820 0L600 300M920 0L700 300M1020 0L800 300" stroke="#7DD3FC" stroke-opacity=".09"/>
  <g filter="url(#glow)">
    <circle cx="1000" cy="85" r="5" fill="#7DD3FC"><animate attributeName="opacity" values=".3;1;.3" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="1080" cy="170" r="3" fill="#38BDF8"><animate attributeName="opacity" values="1;.2;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="220" r="4" fill="#BFDBFE"><animate attributeName="r" values="3;6;3" dur="3.8s" repeatCount="indefinite"/></circle>
  </g>
  <text x="82" y="112" fill="#EAF6FF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" letter-spacing="7">DESIGN • ENGINEERING • PRODUCTS</text>
  <text x="78" y="190" fill="#FFFFFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="66" font-weight="750" letter-spacing="1">MANISH MEENA</text>
  <text x="84" y="228" fill="#BAE6FD" font-family="JetBrains Mono,Consolas,monospace" font-size="18">Graphic designer. Developer. Curious builder.</text>
  <rect x="84" y="252" width="210" height="3" rx="2" fill="#38BDF8"><animate attributeName="width" values="80;210;140;210" dur="5s" repeatCount="indefinite"/></rect>
</svg>